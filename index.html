<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor stock Toni Pons</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1c2430; --muted:#6b7684;
    --border:#e3e7ec; --ok:#1a9e5f; --warn:#e0902a; --bad:#d64545;
    --total:#2f6df6; --market:#8b5cf6; --tradeinn:#0f9d9d;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f141a; --card:#171e26; --text:#e6ebf1; --muted:#93a0ad;
      --border:#232c37; --total:#5b8cff; --market:#a78bfa; --tradeinn:#33c9c9; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.35rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:22px}
  .sec{font-size:1.05rem;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--border);
    display:flex;align-items:center;gap:8px}
  .num{background:var(--text);color:var(--bg);width:24px;height:24px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h3{font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
  .big{font-size:1.5rem;font-weight:700;margin:2px 0}
  .muted{color:var(--muted);font-size:.85rem}
  .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:.9rem}
  .row span:first-child{color:var(--muted)}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600}
  .b-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .b-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
  .tl-card{margin-top:14px}
  .legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .pend{color:var(--muted);font-size:.92rem;padding:6px 0}
  .foot{color:var(--muted);font-size:.8rem;margin-top:28px;text-align:center}
  .err{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad);
    color:var(--bad);padding:12px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 Monitor del stock · Toni Pons → Tradeinn</h1>
  <div class="sub" id="sub">Cargando…</div>
  <div id="content"></div>
  <div class="foot">Se actualiza solo cada 30 min · esta página se refresca sola cada minuto.</div>
</div>
<script>
const DAY=864e5;
const FILES=[
  {key:"Stock Total.csv", label:"Stock Total", color:"var(--total)"},
  {key:"Stock Marketplaces.csv", label:"Stock Marketplaces", color:"var(--market)"},
];

function haceTexto(d){
  if(!d) return "—";
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<90) return "hace "+Math.round(s)+" s";
  const m=s/60; if(m<90) return "hace "+Math.round(m)+" min";
  const h=m/60; if(h<48) return "hace "+Math.round(h)+" h";
  return "hace "+Math.round(h/24)+" días";
}
function fmtFecha(d){ return d?d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""; }
function fmtTam(b){ if(!b) return "—"; if(b>=1e6) return (b/1e6).toFixed(1)+" MB"; if(b>=1e3) return Math.round(b/1e3)+" KB"; return b+" B"; }
function badgeFrescura(d,okH){
  okH=okH||26;
  const h=(Date.now()-d.getTime())/36e5;
  if(h<okH) return '<span class="badge b-ok">al día</span>';
  if(h<okH*2) return '<span class="badge b-warn">'+Math.round(h)+' h</span>';
  return '<span class="badge b-bad">'+Math.round(h/24)+' días sin cambiar</span>';
}
function statsEventos(ev){
  const now=Date.now();
  const t=(ev||[]).map(e=>new Date(e.mtime).getTime()).sort((a,b)=>a-b);
  const en=d=>t.filter(x=>x>=now-d*DAY).length;
  let media="—"; const rec=t.filter(x=>x>=now-15*DAY);
  if(rec.length>=2){ let s=0; for(let i=1;i<rec.length;i++) s+=rec[i]-rec[i-1];
    const h=(s/(rec.length-1))/36e5; media=h<1?Math.round(h*60)+" min":h.toFixed(1)+" h"; }
  return {d1:en(1),d7:en(7),d15:en(15),media};
}
function timelineLanes(lanes){
  const now=Date.now(), start=now-15*DAY, W=920,padL=8,padR=8,padT=26,laneH=30,gap=16;
  const H=padT+lanes.length*(laneH+gap);
  const x=t=>padL+(t-start)/(now-start)*(W-padL-padR);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Línea de tiempo">`;
  for(let i=0;i<=15;i++){ const t=start+i*DAY,px=x(t);
    s+=`<line x1="${px}" y1="${padT}" x2="${px}" y2="${H-6}" stroke="var(--border)"/>`;
    if(i%3===0){const d=new Date(t); s+=`<text x="${px}" y="${padT-9}" fill="var(--muted)" font-size="11" text-anchor="middle">${d.getDate()}/${d.getMonth()+1}</text>`;}}
  lanes.forEach((ln,idx)=>{ const y=padT+idx*(laneH+gap)+laneH/2;
    s+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)"/>`;
    s+=`<text x="${padL}" y="${y-laneH/2-1}" fill="var(--muted)" font-size="11">${ln.label}</text>`;
    (ln.eventos||[]).filter(e=>new Date(e.mtime).getTime()>=start).forEach(e=>{
      const px=x(new Date(e.mtime).getTime());
      s+=`<circle cx="${px}" cy="${y}" r="4.5" fill="${ln.color}"><title>${new Date(e.mtime).toLocaleString("es-ES")} · ${fmtTam(e.size)}</title></circle>`;});});
  return s+`</svg>`;
}
function statRows(st,lbl){
  lbl=lbl||"Cambios";
  return `<div class="row"><span>${lbl} últimas 24 h</span><span>${st.d1}</span></div>
    <div class="row"><span>${lbl} últimos 7 días</span><span>${st.d7}</span></div>
    <div class="row"><span>${lbl} últimos 15 días</span><span>${st.d15}</span></div>
    <div class="row"><span>Intervalo medio</span><span>${st.media}</span></div>`;
}

// ---- Secciones ----
function seccionOrigen(data){
  let cards="";
  FILES.forEach((f,idx)=>{
    const fd=data.ficheros&&data.ficheros[f.key]||{eventos:[],actual:{}};
    const upd=fd.actual&&fd.actual.mtime?new Date(fd.actual.mtime):null;
    const st=statsEventos(fd.eventos);
    cards+=`<div class="card"><h3><span class="dot" style="background:${f.color}"></span>${f.label}</h3>
      <div class="muted">Última actualización</div><div class="big">${haceTexto(upd)}</div>
      <div class="muted">${fmtFecha(upd)} ${upd?badgeFrescura(upd):""}</div>
      <div style="margin-top:12px"><div class="row"><span>Tamaño</span><span>${fmtTam(fd.actual&&fd.actual.size)}</span></div>${statRows(st)}</div></div>`;
  });
  const lanes2=FILES.map(f=>({label:f.label,color:f.key.includes("Total")?"var(--total)":"var(--market)",eventos:(data.ficheros&&data.ficheros[f.key]||{}).eventos}));
  return `<section><h2 class="sec"><span class="num">1</span>Actualización FTP Toni Pons</h2>
    <div class="grid">${cards}</div>
    <div class="card tl-card"><div class="legend">
      <span><span class="dot" style="background:var(--total)"></span>Stock Total</span>
      <span><span class="dot" style="background:var(--market)"></span>Stock Marketplaces</span>
      <span>cada punto = una actualización (15 días)</span></div>${timelineLanes(lanes2)}</div></section>`;
}

function seccionProceso(n,titulo,proc,color,cfg){
  let cuerpo;
  if(!proc||!proc.eventos||!proc.eventos.length){
    cuerpo=`<div class="card"><div class="pend">⏳ <b>Aún no conectado.</b> ${cfg.pendiente}</div></div>`;
  }else{
    const ult=proc.actual||{};
    const upd=ult.mtime?new Date(ult.mtime):new Date(proc.eventos[proc.eventos.length-1].mtime);
    const st=statsEventos(proc.eventos);
    let extra="";
    if(cfg.contarCambios){
      const now=Date.now();
      const copias=(proc.eventos||[]).filter(e=>e.cambio&&new Date(e.mtime).getTime()>=now-15*DAY).length;
      extra+=`<div class="row"><span>Copias con stock nuevo (15 d)</span><span>${copias}</span></div>`;
    }
    if(ult.ultimo_fichero) extra+=`<div class="row"><span>Último fichero</span><span style="font-size:.82rem">${ult.ultimo_fichero}</span></div>`;
    if(ult.size) extra+=`<div class="row"><span>Tamaño</span><span>${fmtTam(ult.size)}</span></div>`;
    if(ult.num_ficheros) extra+=`<div class="row"><span>Ficheros en el FTP</span><span>${ult.num_ficheros}</span></div>`;
    cuerpo=`<div class="card"><h3><span class="dot" style="background:${color}"></span>${cfg.subtitulo}</h3>
      <div class="muted">${cfg.etiqueta}</div><div class="big">${haceTexto(upd)}</div>
      <div class="muted">${fmtFecha(upd)} ${badgeFrescura(upd,cfg.okH)}</div>
      <div style="margin-top:12px">${extra}${statRows(st,cfg.etiquetaConteo)}</div></div>
      <div class="card tl-card"><div class="legend"><span>cada punto = una ${cfg.unidad} (15 días)</span></div>
      ${timelineLanes([{label:cfg.subtitulo,color,eventos:proc.eventos}])}</div>`;
  }
  return `<section><h2 class="sec"><span class="num">${n}</span>${titulo}</h2>${cuerpo}</section>`;
}

function render(data){
  const chk=data.ultima_comprobacion?new Date(data.ultima_comprobacion):null;
  document.getElementById("sub").innerHTML="Última comprobación del robot: <b>"+fmtFecha(chk)+"</b> ("+haceTexto(chk)+")";
  const proc=data.procesos||{};
  document.getElementById("content").innerHTML=
    seccionOrigen(data)+
    seccionProceso(2,"Copiar stock a GitHub",proc.copiar_github,"var(--ok)",
      {subtitulo:"Descarga y guardado en GitHub",etiqueta:"Última ejecución",unidad:"ejecución",okH:1,
       etiquetaConteo:"Ejecuciones",contarCambios:true,
       pendiente:"Este proceso corre en el repo privado; para que reporte aquí hay que darle un pequeño ajuste (lo puede montar Claude cuando quieras)."})+
    seccionProceso(3,"Subir stock a Tradeinn",proc.subir_tradeinn,"var(--tradeinn)",
      {subtitulo:"Fichero en el FTP de Tradeinn",etiqueta:"Última subida detectada",unidad:"subida",okH:2,
       etiquetaConteo:"Subidas",
       pendiente:"Falta añadir el Secret TRADEINN_CONN (y montar la subida). Cuando esté, aquí verás cada subida."});
}

async function cargar(){
  try{
    const r=await fetch("historial.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    data.procesos=data.procesos||{};
    try{
      const r2=await fetch("estado_copiar.json?t="+Date.now(),{cache:"no-store"});
      if(r2.ok){ const ec=await r2.json(); if(ec&&ec.eventos&&ec.eventos.length) data.procesos.copiar_github=ec; }
    }catch(_){}
    render(data);
  }catch(e){
    document.getElementById("content").innerHTML='<div class="err">No se pudo cargar el historial todavía.<br><small>'+e+'</small></div>';
  }
}
cargar(); setInterval(cargar,60000);
</script>
</body>
</html>
